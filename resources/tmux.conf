# GaoGrid's dedicated server never reads ~/.tmux.conf.
set -g status off
# Disable tmux's own mouse features; applications can still request mouse input.
set -g mouse off
set -g automatic-rename off
set -g prefix None
set -g prefix2 None
set -s exit-unattached off
set -s escape-time 10
set -g destroy-unattached off
set -g history-limit 10000
set -g default-terminal xterm-256color
set -s terminal-overrides 'xterm-256color:Tc'
set -g set-clipboard external
# -q tolerates options absent in older tmux versions.
set -gq allow-passthrough on
set -sq extended-keys always
set -sq extended-keys-format csi-u
set -as terminal-features ',xterm*:extkeys'
